<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Thói quen mỗi ngày</title>
  <meta name="description" content="Theo dõi thói quen hằng ngày và sự kiện quan trọng, riêng tư và đồng bộ mọi thiết bị." />
  <meta name="theme-color" content="#F5F1E8" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/event-timeline.css" />
  <link rel="stylesheet" href="css/views/lock.css" />
  <link rel="stylesheet" href="css/views/today.css" />
  <link rel="stylesheet" href="css/views/year.css" />
  <link rel="stylesheet" href="css/views/day-detail.css" />
  <link rel="stylesheet" href="css/views/stats.css" />
</head>
<body>

  <div id="app"></div>

  <!-- Thứ tự nạp quan trọng: config trước, rồi tiện ích dùng chung
       (date-utils/dom-utils không phụ thuộc gì, nhưng nhiều module
       phía sau dùng tới nên phải nạp sớm), rồi tầng dữ liệu, rồi
       view, rồi app.js -->
  <script src="js/config.js"></script>
  <script src="js/date-utils.js"></script>
  <script src="js/dom-utils.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/storage-local.js"></script>
  <script src="js/sync/state.js"></script>
  <script src="js/sync/queue.js"></script>
  <script src="js/sync/mutations.js"></script>
  <script src="js/sync/pull.js"></script>
  <script src="js/sync/index.js"></script>
  <script src="js/tree-icons.js"></script>
  <script src="js/confirm-modal.js"></script>
  <script src="js/event-section.js"></script>
  <script src="js/habit-note-panel.js"></script>
  <script src="js/views/today.js"></script>
  <script src="js/views/year.js"></script>
  <script src="js/views/day-detail.js"></script>
  <script src="js/views/stats.js"></script>
  <script src="js/views/trash.js"></script>
  <script src="js/export-data.js"></script>
  <script src="js/data-repair.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(err => {
          console.warn('Không đăng ký được service worker:', err);
        });
      });
    }
  </script>

</body>
</html>
